# Deploy template. Production does not build this service — it pulls the prebuilt image that
# .gitea/workflows/image-check-publish.yml publishes, and it follows the `:latest` tag.
#
# Updates are driven by Portainer's own image updater, which is what the
# `io.portainer.update.enable` label at the bottom of this file turns on: it polls the tag above
# and redeploys when the digest behind it moves. There is NO watchtower here — an earlier version
# of this file said there was, and it was never true of the running stack (which carries no
# watchtower label at all). The watchtower label has since been dropped from the fleet convention
# entirely, so it is not merely absent here, it must not be re-added.
#
# That polling loop is also why the smoke gate in CI sits between `docker build` and
# `docker push`: nothing between the registry and this container asks a human anything, so an
# image that reaches `:latest` is an image that is already on its way into production.
#
# This is a long-polling Telegram bot. It opens no listening socket, so there is nothing to route
# and nothing to health-check over HTTP — no Traefik labels, no `ports:`, no `healthcheck:`. It
# joins the shared network only to reach outwards: the label-rendering service that turns a
# template into a PDF, and the CUPS host the PDF is printed on.
#
# Every value below is a PLACEHOLDER (XXX) or a non-secret default. Real tokens, addresses and
# document ids live only in the deployment's own environment and are never committed here.
#
# Noticed while writing this: the running stack also sets TEMPLATE_PATH, and it does nothing at
# all. `src/settings.py` declares no such field, and `extra="ignore"` means pydantic drops it
# without complaint; `src/label_maker.py` reads its template paths from module-level constants
# instead. It is deliberately NOT reproduced here — carrying it forward would keep suggesting the
# template location is configurable when it is not — but it is worth removing from the deployment
# too, so nobody edits it expecting an effect.

volumes:
  # The SQLite store of printed labels. It is what makes the «🔁 Перепечатать» button work on old
  # messages, so losing it is not cosmetic: every previously printed label becomes unreprintable.
  # The name matters and must not be "tidied": docker composes it with the stack name to form the
  # real volume, so renaming this key points the service at a NEW, EMPTY volume while the old one
  # sits there full of history and unreferenced. An earlier version of this file named it
  # `asakusa_tg_print`, which is not the volume production actually carries.
  tgprint:

networks:
  docker_main_net:
    external: true

services:
  asakusa-tg-print:
    image: gitea.vvzvlad.xyz/projects/asakusa-tg-print:latest
    container_name: asakusa-tg-print
    restart: always
    volumes:
      - tgprint:/app/data                 # SQLite label store survives restarts/updates
    environment:
      # ── Telegram ──────────────────────────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: XXX
      TELEGRAM_API_SERVER: XXX            # base URL of the self-hosted Bot API server
      # Comma-separated chat IDs (negative for groups) whose members may print.
      # ALLOWED_USER_IDS is deliberately NOT set: access is granted by chat membership alone, so
      # adding somebody to the group is the whole of the access control. Setting it here would
      # silently widen that to a second, per-user path.
      ALLOWED_CHAT_IDS: XXX

      # ── Label rendering ───────────────────────────────────────────────────────
      LABEL_MAKER_URL: http://labeler-offline:8000   # sibling service on the shared network
      LABEL_MAKER_TIMEOUT: "60"           # seconds to wait for a generated PDF
      LABEL_ROTATE: "false"               # false = landscape 58x40mm, printed to CUPS as-is

      # ── Printing ──────────────────────────────────────────────────────────────
      CUPS_HOST: XXX                      # CUPS print server host/IP
      PRINTER_NAME: XP-365B
      PRINTER_MEDIA: Custom.165x114pt
      PRINTER_FIT_TO_PAGE: "true"

      # ── Grist / glaze labels ──────────────────────────────────────────────────
      GRIST_BASE_URL: XXX
      GRIST_DOC_ID: XXX
      GRIST_API_KEY: XXX
      GLAZE_SITE_URL: XXX                 # public site base URL printed into the QR/icon links

      # LOG_LEVEL is not set: the default is INFO, which is what the deployment wants.
      TZ: Europe/Moscow
    networks:
      - docker_main_net
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # Opts this container in to Portainer's image updater, which is what makes a push to
      # `:latest` reach production. Keep it in step with the tag on the `image:` line above: an
      # updater pointed at a tag CI never moves is an updater that silently does nothing.
      io.portainer.update.enable: "true"
