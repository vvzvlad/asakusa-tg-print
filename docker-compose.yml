# Deploy template. Production pulls the image published by
# .gitea/workflows/image-check-publish.yml and follows `:latest`; Portainer's image updater
# (the `io.portainer.update.enable` label below) redeploys when the digest behind it moves. There
# is no watchtower and its label must not be added.
#
# A long-polling Telegram bot with no listening socket: no Traefik labels, no `ports:`, no
# `healthcheck:`. It joins the shared network only to reach the label-rendering service and the
# CUPS host.
#
# Every value below is a placeholder (XXX) or a non-secret default; real tokens, addresses and
# document ids live only in the deployment's environment. TEMPLATE_PATH is not a setting:
# src/label_maker.py reads its template paths from module-level constants.

volumes:
  # The SQLite store of printed labels, needed by the «🔁 Перепечатать» button on old messages.
  # Do not rename the key: docker prefixes it with the stack name, so a new name points the
  # service at a new, empty volume.
  tgprint:

networks:
  docker_main_net:
    external: true

services:
  asakusa-tg-print:
    image: gitea.vvzvlad.xyz/projects/asakusa-tg-print:latest
    container_name: asakusa-tg-print
    restart: always
    volumes:
      - tgprint:/app/data                 # SQLite label store survives restarts/updates
    environment:
      # ── Telegram ──────────────────────────────────────────────────────────────
      TELEGRAM_BOT_TOKEN: XXX
      TELEGRAM_BOT_API_SERVER: XXX        # base URL of the self-hosted Bot API server
      # Comma-separated chat IDs (negative for groups) whose members may print.
      # ALLOWED_USER_IDS is deliberately NOT set: access is granted by chat membership alone, so
      # adding somebody to the group is the whole of the access control. Setting it here would
      # silently widen that to a second, per-user path.
      ALLOWED_CHAT_IDS: XXX

      # ── Label rendering ───────────────────────────────────────────────────────
      LABEL_MAKER_URL: http://labeler-offline:8000   # sibling service on the shared network
      LABEL_MAKER_TIMEOUT: "60"           # seconds to wait for a generated PDF
      LABEL_ROTATE: "false"               # false = landscape 58x40mm, printed to CUPS as-is

      # ── Printing ──────────────────────────────────────────────────────────────
      CUPS_HOST: XXX                      # CUPS print server host/IP
      PRINTER_NAME: XP-365B
      PRINTER_MEDIA: Custom.165x114pt
      PRINTER_FIT_TO_PAGE: "true"

      # ── Grist / glaze labels ──────────────────────────────────────────────────
      GRIST_BASE_URL: XXX
      GRIST_DOC_ID: XXX
      GRIST_API_KEY: XXX
      GLAZE_SITE_URL: XXX                 # public site base URL printed into the QR/icon links

      # LOG_LEVEL is not set: the default is INFO, which is what the deployment wants.
      TZ: Europe/Moscow
    networks:
      - docker_main_net
    logging:
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # Opts this container in to Portainer's image updater, which is what makes a push to
      # `:latest` reach production. Keep it in step with the tag on the `image:` line above: an
      # updater pointed at a tag CI never moves is an updater that silently does nothing.
      io.portainer.update.enable: "true"
