name: Tests

# PR gate. It never logs in to the registry, never pushes and uses no secrets; it runs the same
# tests, build and ci/smoke.py as image-check-publish.yml while :latest stays untouched.
on:
  # Manual re-run of a run that flaked on runner networking.
  workflow_dispatch:
  # A PR runs its head on a self-hosted runner shared with every repository, and this repository
  # is public, so anyone with an account on the instance can trigger it from a fork. A same-repo
  # guard on `github.event.pull_request.head.repo.full_name` is not used: it is unverified on
  # Gitea, and an `if:` that silently evaluates to false would turn this gate into one that never
  # runs and always looks green.
  pull_request:
    # Must name the real default branch, together with the `branches:` filter and the
    # `$REF_NAME` check in image-check-publish.yml; a stale name silently stops the gate.
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Nothing is published, so a superseded run is cancelled in favour of the new head.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Byte-identical to its twin in image-check-publish.yml, so both gates run the same tests.
  tests:
    runs-on: ubuntu-latest
    # Must exceed the step timeouts below plus checkout: act_runner kills the whole job when this
    # fires, and the runner is shared by every repository.
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # The real cost is under two minutes cold; the bound is for a loaded shared runner and a
      # slow pip index.
      timeout-minutes: 20
      env:
        # The same base the Dockerfile uses, so the tests run on the interpreter that ships.
        RUNTIME_IMAGE: python:3.12-slim
      run: |
        set -e
        set -o pipefail
        # The workspace is streamed in as a tar rather than bind-mounted: this job runs inside
        # act_runner's job container while `docker` talks to the host's daemon, so a
        # `-v "$PWD:/src"` would name a path that means something else (or nothing) on the host.
        # It also keeps root-owned __pycache__ out of the checkout. .dockerignore does not apply
        # to the tar, which is what makes tests/ and requirements-dev.txt available.
        # `--pull always`: the daemon is persistent, so without it a cached base would go stale.
        # The seven variables are the ones src/settings.py requires with no default; it builds
        # `Settings()` at import time, so without them collection fails. TELEGRAM_BOT_TOKEN must
        # be shaped `digits:rest`: aiogram validates the format in `Bot.__init__`.
        tar -cf - --exclude=./.git . | docker run --rm -i --pull always \
          -e TELEGRAM_BOT_TOKEN=123456789:AAFakeTestTokenNotReal_0123456789abcdef \
          -e LABEL_MAKER_URL=http://label-maker.test \
          -e CUPS_HOST=cups.test \
          -e GRIST_BASE_URL=https://grist.test \
          -e GRIST_DOC_ID=testdoc \
          -e GRIST_API_KEY=test-key \
          -e GLAZE_SITE_URL=https://glaze.test \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

  build-and-smoke:
    needs: [ tests ]
    # A label advertised by the instance-level runner, not a machine name.
    runs-on: ubuntu-latest
    # Same outer bound as image-check-publish.yml. Step timeouts here sum to 32 minutes; the job
    # bound must exceed that, because a killed job may never run its `if: always()` cleanup.
    timeout-minutes: 55
    # Job-level so the smoke step and the cleanup step use the same value: ci/smoke.py names its
    # three containers after it and the cleanup removes them by those names. The run id keeps
    # concurrent runs on the shared daemon apart; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: asakusa-tg-print-pr-check-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # Local tags with no registry host, keyed by run id. Both outputs are written so the build,
      # smoke and cleanup steps can stay byte-identical to their twins in image-check-publish.yml.
      env:
        RUN_ID: ${{ github.run_id }}
      run: |
        echo "tags=asakusa-tg-print-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"
        echo "smoke=asakusa-tg-print-pr-check:$RUN_ID" >> "$GITHUB_OUTPUT"

    - name: Build the Docker image
      # Step-level timeouts are the ones act_runner enforces; same value as image-check-publish.yml.
      timeout-minutes: 20
      env:
        # `$TAGS` is intentionally unquoted below: word splitting turns the list into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the daemon is persistent, so a cached base image would otherwise go stale.
        # This is a BuildKit build (the default since Engine 23.0); its cache lives in a separate
        # builder store that the cleanup step below does not reclaim.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The same gate that guards production, on a local tag with no login and no push.
      #
      # ci/smoke.py runs on the runner and drives `docker` itself for checks about the container
      # as an object (inspect, no-env behaviour, the real CMD's log and files); checks about the
      # code run in a probe fed to `docker exec -i <name> python -u -` inside the container.
      #
      # No port is published: the bot long-polls Telegram and has no listening socket, and a
      # published port would land in the host daemon's namespace, unreachable from this job.
      #
      # The runner image has `python3` but no `python`; inside the container it is `python`.
      #
      # The gate holds no credential and reaches no external service, which is what lets it run
      # on a pull request.
      #
      # 12 minutes covers ci/smoke.py's documented worst case of 645 s; a normal run is under a
      # minute.
      timeout-minutes: 12
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The `run:` body is byte-identical to the one in image-check-publish.yml, so the PR gate
      # and the publishing gate run the same checks.
      run: |
        python3 ci/smoke.py

    - name: Remove the smoke containers from the runner
      # Runs before the image cleanup, since a leftover container pins the image. ci/smoke.py
      # removes its containers itself; this covers a smoke step killed by its timeout, where a
      # hung container survives its `--rm` because only the docker client was killed.
      if: always()
      run: |
        # "" is the probe container, -guard the missing-environment check, -cmd the run of the
        # real CMD (no `--rm`, because `docker cp` reads it after exit). Kept in step with
        # GUARD_SUFFIX and CMD_SUFFIX in ci/smoke.py. Best-effort, so no `set -e`.
        for suffix in "" -guard -cmd; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # Removes only this run's tag; `docker system prune` would hit other repos on the shared
      # daemon. See image-check-publish.yml for what this does not reclaim. An empty tag list is
      # fine here: nothing to remove is correct.
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
