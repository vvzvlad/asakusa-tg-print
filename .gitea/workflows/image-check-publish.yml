name: Docker Image CI

# No `pull_request` trigger on purpose: this workflow pushes :latest, the tag production follows
# (Portainer's image updater redeploys whatever lands on it, see docker-compose.yml), so a PR
# branch must never be able to move it. PRs are covered by tests.yml, which runs the same tests,
# build and smoke gate without logging in or pushing. Nobody approves between `docker push` and
# the rollout, so the smoke gate is the last point where a broken image can be stopped.
#
# setup-python is deliberately not used: the tests run inside a container on the same docker the
# build uses, so "the tests ran" and "docker works on this runner" are the same statement.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# `packages: write` has no effect on Gitea Actions; the registry push authenticates with the
# REGISTRY_TOKEN secret instead.
permissions:
  contents: read   # checkout

# Runs are serialised so the newest commit's :latest is written last. Cancelling stays off: it
# would kill the older run together with its :<sha> image and leave holes in the tag history.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    # Must exceed the step timeouts below plus checkout: act_runner kills the whole job when this
    # fires, and the runner is shared by every repository.
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7

    - name: Run the test suite in a container
      # The real cost is under two minutes cold; the bound is for a loaded shared runner and a
      # slow pip index.
      timeout-minutes: 20
      env:
        # The same base the Dockerfile uses, so the tests run on the interpreter that ships.
        RUNTIME_IMAGE: python:3.12-slim
      run: |
        set -e
        set -o pipefail
        # The workspace is streamed in as a tar rather than bind-mounted: this job runs inside
        # act_runner's job container while `docker` talks to the host's daemon, so a
        # `-v "$PWD:/src"` would name a path that means something else (or nothing) on the host.
        # It also keeps root-owned __pycache__ out of the checkout. .dockerignore does not apply
        # to the tar, which is what makes tests/ and requirements-dev.txt available.
        # `--pull always`: the daemon is persistent, so without it a cached base would go stale.
        # The seven variables are the ones src/settings.py requires with no default; it builds
        # `Settings()` at import time, so without them collection fails. TELEGRAM_BOT_TOKEN must
        # be shaped `digits:rest`: aiogram validates the format in `Bot.__init__`.
        tar -cf - --exclude=./.git . | docker run --rm -i --pull always \
          -e TELEGRAM_BOT_TOKEN=123456789:AAFakeTestTokenNotReal_0123456789abcdef \
          -e LABEL_MAKER_URL=http://label-maker.test \
          -e CUPS_HOST=cups.test \
          -e GRIST_BASE_URL=https://grist.test \
          -e GRIST_DOC_ID=testdoc \
          -e GRIST_API_KEY=test-key \
          -e GLAZE_SITE_URL=https://glaze.test \
          -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
          -e PYTHONDONTWRITEBYTECODE=1 \
          "$RUNTIME_IMAGE" \
          sh -c 'set -e; mkdir -p /src; tar -xf - -C /src; cd /src; pip install --no-cache-dir -r requirements-dev.txt; pytest --tb=short -q'

  build:
    needs: [ tests ]
    # A label advertised by the instance-level runner, not a machine name.
    runs-on: ubuntu-latest
    # Step timeouts sum to 47 minutes (20 build + 12 smoke + 15 push); the job bound must exceed
    # that, because a killed job may never run its `if: always()` cleanup on the shared daemon.
    timeout-minutes: 55
    # Job-level so the smoke step and the cleanup step use the same value: ci/smoke.py names its
    # three containers after it and the cleanup removes them by those names. The run id keeps
    # concurrent runs on the shared daemon apart; ci/smoke.py refuses to start without it.
    env:
      SMOKE_NAME: asakusa-tg-print-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (production follows :latest); any other branch -> :<branch>.
      # The "main" check below, the `branches:` filter above and the `pull_request` filter in
      # tests.yml must all name the real default branch; a mismatch fails silently.
      # workflow_dispatch can run off any ref, so the else branch must never produce a tag
      # production deploys from.
      env:
        # Through the environment, not interpolated: branch names may contain `$(...)`, and the
        # runner is self-hosted and shared.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase in image paths, Gitea allows it in repo names.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so :latest is pushed last and only
          # after its immutable :<sha> rollback point reached the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate needs one unambiguous tag; :<sha> can only mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Sanitise into a legal docker tag ([a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}): illegal
          # characters become `-`, a bad first character becomes `_`, length is capped at 100.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch literally named `latest` must not produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Step-level timeouts are the ones act_runner enforces; the job-level one is the outer bound.
      timeout-minutes: 20
      env:
        # `$TAGS` is intentionally unquoted below: word splitting turns the list into loop items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the daemon is persistent, so a cached base image would otherwise go stale.
        # This is a BuildKit build (the default since Engine 23.0); its cache lives in a separate
        # builder store that the cleanup step below does not reclaim.
        docker build --pull . --file Dockerfile $tag_args

    - name: Smoke-test the built image
      # The gate between build and push: a red smoke means nothing reaches the registry.
      #
      # ci/smoke.py runs on the runner and drives `docker` itself for checks about the container
      # as an object (inspect, no-env behaviour, the real CMD's log and files); checks about the
      # code run in a probe fed to `docker exec -i <name> python -u -` inside the container.
      #
      # No port is published: the bot long-polls Telegram and has no listening socket, and a
      # published port would land in the host daemon's namespace, unreachable from this job.
      #
      # The runner image has `python3` but no `python`; inside the container it is `python`.
      #
      # The gate holds no credential and reaches no external service: a fake token, `.test`
      # (RFC 2606) hostnames, and loopback ports nothing binds.
      #
      # 12 minutes covers ci/smoke.py's documented worst case of 645 s; a normal run is under a
      # minute. If this timeout kills the step, the `if: always()` cleanup below removes the
      # containers.
      timeout-minutes: 12
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # The `run:` body is byte-identical to the one in tests.yml, so the PR gate and the
      # publishing gate run the same checks.
      run: |
        python3 ci/smoke.py

    - name: Log in to the Gitea container registry
      # Placed after build and smoke, which run arbitrary code on a shared runner, so the
      # registry credentials are not in the docker config during that stretch.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # A PAT with `write:package`; the built-in Gitea Actions token has no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      timeout-minutes: 15
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # A failed :<sha> push must stop the loop before :latest moves; this must not depend on
        # the runner's default shell flags.
        set -e
        # Count the tags after word splitting: an empty or whitespace-only $TAGS must fail the
        # step instead of reporting a push that published nothing.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done

    - name: Remove the smoke containers from the runner
      # Runs before the image cleanup, since a leftover container pins the image. ci/smoke.py
      # removes its containers itself; this covers a smoke step killed by its timeout, where a
      # hung container survives its `--rm` because only the docker client was killed.
      if: always()
      run: |
        # "" is the probe container, -guard the missing-environment check, -cmd the run of the
        # real CMD (no `--rm`, because `docker cp` reads it after exit). Kept in step with
        # GUARD_SUFFIX and CMD_SUFFIX in ci/smoke.py. Best-effort, so no `set -e`.
        for suffix in "" -guard -cmd; do docker rm -f "$SMOKE_NAME$suffix" || true; done

    - name: Remove the built images from the runner
      # Removes only this run's tags; `docker system prune` would hit other repos on the shared
      # daemon. The BuildKit cache and dangling base images left by `--pull` need a separate
      # periodic cleanup on the runner host.
      # Unlike the push step, an empty tag list is fine here: nothing to remove is correct.
      if: always()
      env:
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
